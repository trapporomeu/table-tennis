<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contador de Ping Pong</title>
  <meta name="description" content="Placar flip de tênis de mesa: pontos, saque automático, sets e temas." />
  <link rel="icon" type="image/png" href="./images/favicon.png" />
  <link rel="apple-touch-icon" href="./images/favicon.png" />
  <link rel="stylesheet" href="flip_animation.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    .hide { display: none !important; }
    button {
      display: flex; justify-content: center; height: 35px; align-items: center;
      margin: 10px 10px; background: none !important; padding: 8px 10px;
      backdrop-filter: blur(25px); border: none; color: var(--text);
      cursor: pointer; border-radius: 5px; font-size: 1rem;
    }
    button:hover svg { color: var(--text) !important; filter: contrast(0%) !important; transform: scale(1.1); }
    .slider-container { position: relative; }
    .time-sliders { display: flex; flex-direction: column; gap: 14px; }
    .time-row { display: flex; flex-direction: column; gap: 4px; }
    .time-label {
      display: flex; justify-content: space-between; align-items: baseline;
      font-family: "Orbitron", Arial, Helvetica, sans-serif; font-size: 12px;
      color: var(--text); opacity: 0.7; padding: 0 2px;
    }
    .time-label .time-value { font-weight: bold; opacity: 1; font-size: 13px; }
    #reset-btn i, #swap-serve-btn i { font-size: 30px; }

    /* Placar */
    .player-info {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-top: 1.6rem; margin-bottom: 0;
    }
    .player-name {
      background: transparent; border: none; border-bottom: 2px solid transparent;
      color: var(--text); font-family: "Orbitron", Arial, sans-serif;
      font-size: clamp(.9rem, 1.6vw, 1.3rem); text-align: center;
      width: clamp(6rem, 14vw, 10rem); padding: 2px 0;
      transition: border-color .2s ease;
    }
    .player-name:focus { outline: none; border-bottom-color: var(--text); }
    .games-column {
      display: flex; flex-direction: row; align-items: center; justify-content: center;
      gap: 1.4rem; flex: 0 0 auto; padding: 0 .6rem;
    }
    .mini-flip-card-wrap { width: 5rem; }
    .games-column .flip-card { font-size: 3.2rem; }
    .games-column .flip-card,
    .games-column .flip-card .top,
    .games-column .flip-card .bottom,
    .games-column .flip-card .top-flip,
    .games-column .flip-card .bottom-flip {
      box-sizing: border-box;
    }

    /* Card inteiro de quem vai sacar fica cinza para diferenciar do preto */
    .holder.serving {
      background-color: #4a4a4a;
    }
    .holder .flip_container { padding-top: 2%; padding-bottom: 0; }
    .score-buttons { display: flex; justify-content: center; gap: 22px; margin-top: -34px; }
    .score-btn {
      width: 4.4rem; height: 4.4rem; border-radius: 50%; border: none;
      background-color: var(--holder); color: var(--text); font-family: inherit;
      font-size: 2.4rem; line-height: 1; cursor: pointer;
      transition: transform .12s ease;
    }
    .score-btn:hover { transform: scale(1.1); }
    .score-btn:active { transform: scale(.92); }

    #best-of-select {
      border: 2px solid var(--text) !important;
    }
    #size_range_slider {
      width: 100%;
      margin: 0;
    }

    .winner-overlay {
      position: fixed; inset: 0; background-color: rgba(0,0,0,.75);
      display: flex; align-items: center; justify-content: center; z-index: 30;
      backdrop-filter: blur(6px);
    }
    .winner-card { background-color: var(--holder); border-radius: 1rem; padding: 2.2rem 3rem; text-align: center; color: var(--text); }
    .winner-label { margin: 0 0 .4rem 0; opacity: .6; font-size: 1rem; font-family: "Orbitron", Arial, sans-serif; }
    .winner-card h1 { margin: 0 0 1.4rem 0; font-family: "Orbitron", Arial, sans-serif; font-size: clamp(2rem, 6vw, 3.2rem); }
    .winner-card button { background-color: var(--text) !important; color: var(--holder); border-radius: .5rem; padding: .6rem 1.4rem; font-size: 1.1rem; margin: 0 auto; font-family: "Orbitron", Arial, sans-serif; }

    /* Aviso de rotação (apenas telas de celular em pé) */
    .rotate-warning {
      display: none;
      position: fixed;
      inset: 0;
      background-color: var(--background);
      color: var(--text);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      text-align: center;
      padding: 2rem;
    }
    .rotate-warning i { font-size: 4rem; animation: rotate-hint 1.6s ease-in-out infinite; }
    .rotate-warning p { font-family: "Orbitron", Arial, sans-serif; font-size: 1.1rem; max-width: 20rem; margin: 0; }
    @keyframes rotate-hint {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }
    @media (orientation: portrait) and (max-width: 900px) {
      .rotate-warning { display: flex; }
      .container, #controls, .menu, .winner-overlay { display: none !important; }
    }

    /* No mobile o tamanho do placar se ajusta sozinho, sem controle manual */
    @media (max-width: 900px) {
      #size_range_slider { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="rotate-warning" id="rotate-warning">
    <i class="ph ph-device-mobile"></i>
    <p>Coloque seu celular na horizontal</p>
  </div>

  <div style="z-index: 1 !important" class="container">
    <div class="holder" id="holder-a">
      <div class="player-info">
        <input class="player-name" id="name-a" value="Jogador 1" maxlength="16" />
      </div>
      <div class="flip_container">
        <div class="container-segment">
          <div class="segment">
            <div class="flip-card" id="score-a-card">
              <div class="top">00</div>
              <div class="bottom">00</div>
            </div>
          </div>
        </div>
      </div>
      <div class="score-buttons">
        <button class="score-btn minus" data-player="a" data-delta="-1" aria-label="Diminuir ponto">&minus;</button>
        <button class="score-btn plus" data-player="a" data-delta="1" aria-label="Adicionar ponto">+</button>
      </div>
    </div>

    <div class="games-column">
      <div class="mini-flip-card-wrap">
        <div class="flip-card mini-flip-card" id="games-a-card">
          <div class="top">0</div>
          <div class="bottom">0</div>
        </div>
      </div>
      <div class="mini-flip-card-wrap">
        <div class="flip-card mini-flip-card" id="games-b-card">
          <div class="top">0</div>
          <div class="bottom">0</div>
        </div>
      </div>
    </div>

    <div class="holder" id="holder-b">
      <div class="player-info">
        <input class="player-name" id="name-b" value="Jogador 2" maxlength="16" />
      </div>
      <div class="flip_container">
        <div class="container-segment">
          <div class="segment">
            <div class="flip-card" id="score-b-card">
              <div class="top">00</div>
              <div class="bottom">00</div>
            </div>
          </div>
        </div>
      </div>
      <div class="score-buttons">
        <button class="score-btn minus" data-player="b" data-delta="-1" aria-label="Diminuir ponto">&minus;</button>
        <button class="score-btn plus" data-player="b" data-delta="1" aria-label="Adicionar ponto">+</button>
      </div>
    </div>
  </div>

  <div style="z-index: 3 !important" id="controls">

      <div style="display: flex; justify-content: center; width: 100%; gap: 20px; margin-bottom: 20px">
        <button id="swap-serve-btn" style="margin: 0; padding: 0; height: fit-content; display: flex; align-items: center; justify-content: center; margin-right: 4px" title="Trocar saque manualmente">
          <i class="ph ph-arrows-left-right" style="opacity: 80%"></i>
        </button>
        <button id="reset-btn" style="margin: 0; padding: 0; height: fit-content; display: flex; align-items: center; justify-content: center" title="Reiniciar partida">
          <i class="ph ph-arrow-counter-clockwise" style="opacity: 80%"></i>
        </button>
      </div>

      <div class="time-sliders">
        <div class="time-row">
          <div class="time-label"><span>Melhor de</span></div>
          <select id="best-of-select" style="width: 100%; background: var(--holder); color: var(--text); border: none; border-radius: 6px; padding: 6px; font-family: 'Orbitron', Arial, sans-serif;">
            <option value="1">1 set</option>
            <option value="3" selected>3 sets</option>
            <option value="5">5 sets</option>
            <option value="7">7 sets</option>
          </select>
        </div>
